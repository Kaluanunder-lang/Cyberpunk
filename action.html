<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyberpunk Toolkit</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header class="brand">
      <h1 data-text="CYBERPUNK TOOLKIT">CYBERPUNK TOOLKIT</h1>
      <p>Night City field ops // RED &amp; 2077 compatible</p>
      <div class="scene-status" id="scene-status">Connecting…</div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="rounds">Rounds</button>
      <button class="tab-btn" data-tab="armory">Armory</button>
      <button class="tab-btn" data-tab="sandevistan">Sandy</button>
      <button class="tab-btn" data-tab="vehicles">Vehicles</button>
      <button class="tab-btn" data-tab="log">Log</button>
    </nav>

    <main id="main">
      <section class="tab-panel active" id="tab-rounds" data-tab-panel="rounds"></section>
      <section class="tab-panel" id="tab-armory" data-tab-panel="armory"></section>
      <section class="tab-panel" id="tab-sandevistan" data-tab-panel="sandevistan"></section>
      <section class="tab-panel" id="tab-vehicles" data-tab-panel="vehicles"></section>
      <section class="tab-panel" id="tab-log" data-tab-panel="log"></section>
    </main>
  </div>

  <script type="module" src="/action.js"></script>
</body>
</html>
